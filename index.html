<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="喫煙記録">
<title>喫煙記録</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,sans-serif;background:#111;color:#eee;padding:16px;padding-bottom:40px}
.clock{text-align:center;font-size:24px;font-weight:bold;margin:8px 0 16px}
.card{background:#1e1e1e;border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{font-size:18px;margin-bottom:10px}
.mev h2{color:#6cf}
.iqos h2{color:#fc6}
.row{display:flex;align-items:center;justify-content:space-between;margin:10px 0;font-size:15px}
.row input{width:64px;font-size:18px;padding:6px;border-radius:8px;border:1px solid #444;background:#2a2a2a;color:#eee;text-align:center}
.prev{color:#aaa}
.today{color:#8f8;font-size:15px;text-align:right;margin-top:6px}
.btn{display:block;width:100%;padding:14px;font-size:17px;border:none;border-radius:12px;margin-top:10px;color:#fff;background:#2e7d32}
.btn.gray{background:#444}
.small{display:flex;gap:8px}
.small .btn{font-size:14px;padding:10px}
textarea{width:100%;height:80px;margin-top:10px;background:#2a2a2a;color:#eee;border:1px solid #444;border-radius:8px;font-size:12px;padding:6px}
#page-log{display:none}
.head{position:fixed;top:0;left:0;right:0;background:#111;padding:10px 12px;z-index:10;border-bottom:1px solid #333}
.back{margin-bottom:8px;padding:6px 12px;font-size:14px;border:none;border-radius:8px;background:#333;color:#eee}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.months button{padding:10px 0;font-size:15px;border:none;border-radius:8px;background:#555;color:#fff}
.months button.on{background:#2e7d32}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:4px 2px;white-space:nowrap}
td.num{text-align:right}
tr.first td{padding-top:10px}
tr.total td{border-bottom:1px solid #333;padding-bottom:10px;font-weight:bold}
.sum{background:#1e1e1e;border-radius:12px;padding:10px;margin:8px 0 0}
.sum tr.total td{border-bottom:none}
.empty{color:#888;text-align:center;margin-top:30px}
</style>
</head>
<body>

<div id="page-top">
  <div class="clock" id="clock"></div>

  <div class="card mev">
    <h2>メビウス</h2>
    <div class="row"><span>前回の残り</span><span class="prev" id="mev-prev"></span></div>
    <div class="row"><span>今日の購入数</span><span><input type="number" inputmode="numeric" id="mev-buy"> 箱</span></div>
    <div class="row"><span>今日の残り</span><span><input type="number" inputmode="numeric" id="mev-box"> 箱 <input type="number" inputmode="numeric" id="mev-pcs"> 本</span></div>
    <div class="today" id="mev-today"></div>
  </div>

  <div class="card iqos">
    <h2>IQOS</h2>
    <div class="row"><span>前回の残り</span><span class="prev" id="iqos-prev"></span></div>
    <div class="row"><span>今日の購入数</span><span><input type="number" inputmode="numeric" id="iqos-buy"> 箱</span></div>
    <div class="row"><span>今日の残り</span><span><input type="number" inputmode="numeric" id="iqos-box"> 箱 <input type="number" inputmode="numeric" id="iqos-pcs"> 本</span></div>
    <div class="today" id="iqos-today"></div>
  </div>

  <button class="btn" onclick="saveToday()">保存</button>
  <button class="btn gray" onclick="showLog()" style="margin-top:24px">記録ページへ</button>

  <div class="card" style="margin-top:30px">
    <h2>バックアップ</h2>
    <div class="small">
      <button class="btn gray" onclick="exportData()">書き出し</button>
      <button class="btn gray" onclick="importData()">読み込み</button>
    </div>
    <textarea id="backup" placeholder="書き出し→全選択してコピーして保管。読み込み→ここに貼り付けてから押す"></textarea>
  </div>
</div>

<div id="page-log">
  <div class="head" id="logHead">
    <button class="back" onclick="showTop()">← トップへ</button>
    <div class="months" id="months"></div>
    <div id="logSum"></div>
  </div>
  <div id="logBody"></div>
</div>

<script>
const KEY = 'smokeLog';
const PRICE = { mev: 29, iqos: 31 };
const TYPES = ['mev', 'iqos'];
let data = load();
let curMonth = new Date().getMonth() + 1;

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { alert('保存に失敗しました'); }
}
function pad(n) { return String(n).padStart(2, '0'); }
function dateKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function todayKey() {
  const d = new Date();
  if (d.getHours() < 3) d.setDate(d.getDate() - 1);
  return dateKey(d);
}
function yen(n) { return n.toLocaleString() + '円'; }
function totalPcs(r) { return (r.box || 0) * 20 + (r.pcs || 0); }

function prevKey(key, type) {
  const keys = Object.keys(data).filter(k => k.startsWith(pre)).sort().reverse();
  return keys.length ? keys[keys.length - 1] : null;
}
function smoked(key, type) {
  if (!data[key] || !data[key][type]) return null;
  const p = prevKey(key, type);
  if (!p) return null;
  const c = data[key][type];
  return totalPcs(data[p][type]) + (c.buy || 0) * 20 - totalPcs(c);
}

function tick() {
  const d = new Date();
  const w = '日月火水木金土'[d.getDay()];
  document.getElementById('clock').textContent =
    (d.getMonth() + 1) + '月' + d.getDate() + '日(' + w + ') ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}

function renderTop() {
  const tk = todayKey();
  TYPES.forEach(t => {
    const p = prevKey(tk, t);
    const prevEl = document.getElementById(t + '-prev');
    if (p) {
      const r = data[p][t];
      prevEl.textContent = Number(p.slice(5, 7)) + '/' + Number(p.slice(8)) + '　' + r.box + '箱' + r.pcs + '本';
    } else {
      prevEl.textContent = '記録なし';
    }
    const c = data[tk] && data[tk][t];
    document.getElementById(t + '-box').value = c ? c.box : '';
    document.getElementById(t + '-pcs').value = c ? c.pcs : '';
    document.getElementById(t + '-buy').value = c && c.buy ? c.buy : '';
    const s = smoked(tk, t);
    document.getElementById(t + '-today').textContent = s === null ? '' : '今日 ' + s + '本　' + yen(s * PRICE[t]);
  });
}

function saveToday() {
  const tk = todayKey();
  const rec = {};
  TYPES.forEach(t => {
    const b = document.getElementById(t + '-box').value;
    const pc = document.getElementById(t + '-pcs').value;
    const buy = document.getElementById(t + '-buy').value;
    if (b === '' && pc === '') return;
    rec[t] = { box: Number(b) || 0, pcs: Number(pc) || 0, buy: Number(buy) || 0 };
  });
  if (!Object.keys(rec).length) { alert('残数を入力してください'); return; }
  data[tk] = rec;
  save();
  renderTop();
  alert('保存しました');
}

function buildMonths() {
  const box = document.getElementById('months');
  box.innerHTML = '';
  for (let m = 1; m <= 12; m++) {
    const b = document.createElement('button');
    b.textContent = m + '月';
    if (m === curMonth) b.className = 'on';
    b.onclick = () => { curMonth = m; buildMonths(); renderLog(); window.scrollTo(0, 0); };
    box.appendChild(b);
  }
}

function line(cls, day, label, v, price) {
  return '<tr class="' + cls + '"><td>' + day + '</td><td>' + label + '</td>' +
    '<td class="num">' + (v === null ? '-' : v + '本') + '</td>' +
    '<td class="num">' + (v === null ? '-' : yen(v * price)) + '</td></tr>';
}

function renderLog() {
  const pre = new Date().getFullYear() + '-' + pad(curMonth) + '-';
  const keys = Object.keys(data).filter(k => k.startsWith(pre)).sort();
  let rows = '';
  let sumM = 0, sumQ = 0;
  keys.forEach(k => {
    const m = smoked(k, 'mev');
    const q = smoked(k, 'iqos');
    if (m === null && q === null) return;
    const mv = m || 0, qv = q || 0;
    sumM += mv;
    sumQ += qv;
    const d = Number(k.slice(8)) + '日';
    rows += line('first', d, 'メビウス', m, 29);
    rows += line('', '', 'IQOS', q, 31);
    rows += '<tr class="total"><td></td><td>合計</td><td class="num">' + (mv + qv) + '本</td><td class="num">' + yen(mv * 29 + qv * 31) + '</td></tr>';
  });
  let sumHtml = '';
  let html = '';
  if (rows) {
    sumHtml += '<div class="sum"><table>';
    sumHtml += line('', curMonth + '月', 'メビウス', sumM, 29);
    sumHtml += line('', '', 'IQOS', sumQ, 31);
    sumHtml += '<tr class="total"><td></td><td>合計</td><td class="num">' + (sumM + sumQ) + '本</td><td class="num">' + yen(sumM * 29 + sumQ * 31) + '</td></tr>';
    sumHtml += '</table></div>';
    html = '<table>' + rows + '</table>';
  } else {
    html = '<div class="empty">この月の記録はありません</div>';
  }
  document.getElementById('logSum').innerHTML = sumHtml;
  const body = document.getElementById('logBody');
  body.innerHTML = html;
  body.style.paddingTop = (document.getElementById('logHead').offsetHeight - 6) + 'px';
}

function showLog() {
  document.getElementById('page-top').style.display = 'none';
  document.getElementById('page-log').style.display = 'block';
  curMonth = new Date().getMonth() + 1;
  buildMonths();
  renderLog();
  window.scrollTo(0, 0);
}
function showTop() {
  document.getElementById('page-log').style.display = 'none';
  document.getElementById('page-top').style.display = 'block';
  renderTop();
  window.scrollTo(0, 0);
}

function exportData() {
  const ta = document.getElementById('backup');
  ta.value = JSON.stringify(data);
  ta.focus();
  ta.select();
}
function importData() {
  const txt = document.getElementById('backup').value.trim();
  if (!txt) { alert('貼り付けてから押してください'); return; }
  try {
    const obj = JSON.parse(txt);
    if (typeof obj !== 'object' || Array.isArray(obj)) throw 0;
    if (!confirm('今のデータを上書きします。よろしいですか?')) return;
    data = obj;
    save();
    renderTop();
    document.getElementById('backup').value = '';
    alert('読み込みました');
  } catch (e) {
    alert('データの形式が正しくありません');
  }
}

tick();
setInterval(tick, 1000);
renderTop();
</script>
</body>
</html>
